  <main class="contact">
    <h1>let's make something happen</h1>

    <iframe name="hidden_iframe" title="form target" style="display:none"></iframe>

    <form id="contact-form"
          action="https://docs.google.com/forms/d/e/1FAIpQLSeqGZSbZBymyTTaMnO7YeoTdLOs3ZnKVjRO1VKHXuJvcDLLQA/formResponse"
          method="POST" target="hidden_iframe">
      <div class="name-row">
        <label>First Name <small>(required)</small>
          <input type="text" name="entry.457008966" required>
        </label>
        <label>Last Name <small>(required)</small>
          <input type="text" name="entry.1453457360" required>
        </label>
      </div>
      <label>Email Address <small>(required)</small>
        <input type="email" name="entry.2095623285" required>
      </label>
      <label>Subject <small>(required)</small>
        <input type="text" name="entry.1551645468" required>
      </label>
      <label>Message <small>(required)</small>
        <textarea name="entry.1803993835" required></textarea>
      </label>
      <button type="submit">Submit</button>
    </form>

    <p id="thanks" hidden style="text-align:center; font-size:1.3rem; padding:2rem 0;">
      Thanks for reaching out! I'll get back to you soon.
    </p>

    <p style="text-align:center; margin-top:3rem;">

    </p>

  <script>
    const form = document.getElementById("contact-form");
    const thanks = document.getElementById("thanks");
    form.addEventListener("submit", () => {
      setTimeout(() => {
        form.style.display = "none";
        thanks.hidden = false;
      }, 400);
    });
  </script>
